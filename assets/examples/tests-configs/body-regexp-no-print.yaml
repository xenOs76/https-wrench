# yaml-language-server: $schema=../../../https-wrench.schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
---
debug: false
verbose: true
requests:
  - name: BodyRegexpNoPrint
    transportOverrideUrl: https://localhost:9443
    responseBodyMatchRegexp: .*headers.*
    printResponseBody: false
    hosts:
      - name: localhost
        uriList:
          - /headers
