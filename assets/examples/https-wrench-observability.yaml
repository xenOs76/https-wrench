# yaml-language-server: $schema=../../https-wrench.schema.json
---
##
##   HTTPS Wrench - Observability Mode Configuration
##
##   Runs continuous synthetic probes at a configured interval and exports
##   Prometheus and OpenTelemetry metrics via:
##     1. Pull: Embedded HTTP scrape server (/metrics)
##     2. Push: Prometheus remote_write endpoint
##     3. Push: OpenTelemetry OTLP/HTTP endpoint
##

debug: false
verbose: false
concurrency: 10

## observability - Configuration for continuous monitoring and metrics propagation
observability:
  ## enabled - Enables continuous observability mode (can also be enabled via CLI flag --observe)
  enabled: true

  ## interval - Frequency of probe cycles (e.g. 15s, 30s, 1m)
  interval: 30s

  ## timeout - Maximum duration allowed for a single probe cycle
  timeout: 25s

  ## pull - Embedded HTTP server exposing Prometheus metrics for scraping
  pull:
    enabled: true
    address: ":9090"
    path: "/metrics"

  ## push - Metric push destinations (Prometheus remote_write and/or OpenTelemetry OTLP)
  push:
    ## prometheus - Direct push to Prometheus remote_write compatible TSDBs
    ## (Prometheus with --web.enable-remote-write-receiver, VictoriaMetrics, Thanos, Mimir)
    prometheus:
      enabled: false
      remoteWriteUrl: "https://prometheus-rw.example.com/api/v1/write"
      timeout: 10s
      # basicAuthUser: "admin"
      # basicAuthPassword: "password"
      # bearerToken: "your-api-token"
      headers:
        X-Scope-OrgID: "tenant-a"

    ## otlp - Direct push to OpenTelemetry collector or APM backend (OTLP/HTTP)
    otlp:
      enabled: false
      endpoint: "https://otel-collector.example.com:4318/v1/metrics"
      protocol: "http/protobuf"
      timeout: 10s
      headers:
        X-Custom-Header: "observability-agent"

  ## metrics - Fine-tune exported metrics and cardinality controls
  metrics:
    ## includeTls - Generate TLS parameters and certificate expiration metrics
    includeTls: true

    ## includeCertChain - Export metrics for full certificate chain (false = leaf certificate only)
    includeCertChain: false

    ## stripQuery - Strip URL query strings from 'uri' metric labels to prevent cardinality explosion
    stripQuery: true

    ## customLabels - Static key/value labels attached to every exported metric
    customLabels:
      env: "production"
      probe_region: "homelab-dc"

## requests - List of HTTPS requests to probe periodically
requests:
  - name: CoreApiHealthCheck
    clientTimeout: 5
    insecure: false
    # responseBodyMatchRegexp evaluates a regex against the response body.
    # When configured, https-wrench exports:
    #   - https_wrench_probe_body_matches (1 for match, 0 for mismatch) with labels:
    #     - regexp: the pattern
    #   - https_wrench_probe_requests_total includes label body_match="matched|mismatched|none"
    #   (The matched value and certificate subject are recorded in structured logs to preserve bounded metric cardinality)
    responseBodyMatchRegexp: "\"status\":\\s*\"([a-zA-Z]+)\""
    hosts:
      - name: api.example.com
        uriList:
          - /healthz
          - /v1/status

  - name: PublicWebService
    clientTimeout: 5
    hosts:
      - name: example.com
        uriList:
          - /
